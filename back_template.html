<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100%;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        .pinyin-wrapper {
            width: 300px;
            text-align: center;
        }
        .pinyin {
            font-size: 20px;
            padding: 10px 0;
            font-family: sans-serif;
        }
        .hanzi-container {
            width: 300px;
            height: 300px;
            padding: 0 auto;
            background-color: #FFFFFF;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .nightMode .hanzi-container {
            background-color: #BBB; /* Darker container */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        .meaning {
            font-size: 24px;
            text-align: center;
            padding: 10px 0;
            border-radius: 4px;
            width: 300px;
        }
        .preview-btn {
            width: 300px;
            margin: 5px 0;
            font-size: 16px;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .preview-btn:hover {
            background-color: #5F5F5F;
            border: none;
        }
    </style>
</head>
<body>
    <audio id="myAudio" autoplay>
        <source src="{{Audio}}" type="audio/mp3">
    </audio>
    <div class="pinyin-wrapper">
        <span class="pinyin">{{Pinyin}}</span>
    </div>
    <div id="hanzi-container" class="hanzi-container">
        <svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" id="grid-background-target">
            <line x1="5" y1="5" x2="295" y2="295" stroke="#DDD" />
            <line x1="295" y1="0" x2="0" y2="295" stroke="#DDD" />
            <line x1="150" y1="0" x2="150" y2="300" stroke="#DDD" />
            <line x1="0" y1="150" x2="300" y2="150" stroke="#DDD" />
        </svg>
    </div>
    <div class="meaning">{{Meaning}}</div>
    <button id="preview-btn" class="preview-btn" onclick="ShowFullAnimation()">Show Preview</button>
    <button id="quiz-btn" class="preview-btn" onclick="StartFullQuiz()">Practice</button>
    <button id="toggle-preview-btn" class="preview-btn" onclick="TogglePreview()">Toggle Outline</button>
    <script src="hanzi-writer.min.js"></script>
    <script>
        // Global variables
        let writer = null; // Explicitly initialize to null
        const container = document.getElementById('hanzi-container');
        const proficiency = parseInt(`{{Proficiency}}` || 0);
        let currCharIndex = 0;
        const fullString = '{{Hanzi}}'.replace(/[^\u4E00-\u9FFF]/g, '') || '字';
        let currChar = fullString[currCharIndex];
        let isAnimating = false; // Track animation/quiz state
        let shouldShowOutline = true;

        // Reset writer to avoid conflicts from front template
        function resetWriter() {
            writer = null;
            console.log("Writer reset for card back");
        }

        function TriggerAnimation() {
            if (isAnimating) return;
            isAnimating = true;
            writer.animateCharacter().then(() => {
                isAnimating = false;
                ShowNextCharacterAnimation();
            }).catch((error) => {
                console.error("Animation failed:", error);
                isAnimating = false;
            });
        }

        function ShowNextCharacterAnimation() {
            if (currCharIndex < fullString.length - 1) {
                currCharIndex += 1;
                currChar = fullString[currCharIndex];
                writer.setCharacter(currChar).then(() => {
                    TriggerAnimation();
                }).catch((error) => {
                    console.error("Set character failed:", error);
                    isAnimating = false;
                });
            }
        }

        function TriggerQuiz() {
            if (isAnimating) return;
            isAnimating = true;
            writer.quiz({
                onComplete: function(summaryData) {
                    isAnimating = false;
                    ShowNextCharacterQuiz();
                }
            });
        }

        function ShowNextCharacterQuiz() {
            if (currCharIndex < fullString.length - 1) {
                currCharIndex += 1;
                currChar = fullString[currCharIndex];
                writer.setCharacter(currChar).then(() => {
                    TriggerQuiz();
                }).catch((error) => {
                    console.error("Set character failed:", error);
                    isAnimating = false;
                });
            }
        }

        function ShowFullAnimation() {
            if (isAnimating) return;
            writer.cancelQuiz();
            currCharIndex = 0;
            currChar = fullString[currCharIndex];
            writer.setCharacter(currChar).then(() => {
                TriggerAnimation();
            }).catch((error) => {
                console.error("Show full animation failed:", error);
            });
        }

        function StartFullQuiz() {
            if (isAnimating) return;
            writer.cancelQuiz();
            currCharIndex = 0;
            currChar = fullString[currCharIndex];
            writer.setCharacter(currChar).then(() => {
                TriggerQuiz();
            }).catch((error) => {
                console.error("Start full quiz failed:", error);
            });
        }

        function TogglePreview() {
            if (isAnimating) return;
            shouldShowOutline = !shouldShowOutline;
            if (shouldShowOutline) {
                writer.showOutline();
            } else {
                writer.hideOutline();
            }
        }

        function initializeHanziWriter() {
            if (writer) {
                console.log("Writer already initialized for this card back");
                return true;
            }
            if (!container || !window.HanziWriter) {
                console.warn("Container or HanziWriter not ready");
                return false;
            }

            const hanziDiv = document.getElementById('hanzi-container');
            ['touchstart'].forEach(function(eventName) {
                hanziDiv.addEventListener(eventName, function(e) {
                    e.stopPropagation();
                }, false);
            });

            // Set playback speed based on proficiency
            const strokeSpeed = proficiency >= 3 ? 1.5 : 1;
            const strokeDelay = proficiency >= 3 ? 100 : 500;

            writer = HanziWriter.create('grid-background-target', currChar, {
                width: 300,
                height: 300,
                outlineColor: '#999',
                showOutline: shouldShowOutline,
                showCharacter: true,
                padding: 10,
                strokeAnimationSpeed: strokeSpeed,
                delayBetweenStrokes: strokeDelay,
                strokeColor: '#333',
            });

            // Start with animation by default
            TriggerAnimation();
            console.log("HanziWriter initialized successfully for card back");
            return true;
        }

        function waitForResourcesAndInitialize() {
            let attempts = 0;
            const maxAttempts = 10; // Limit retries
            const retryDelay = 100; // Delay between retries (ms)

            function tryInitialize() {
                if (initializeHanziWriter()) {
                    return;
                }
                if (attempts < maxAttempts) {
                    attempts++;
                    console.log(`Retrying initialization (attempt ${attempts}/${maxAttempts})...`);
                    setTimeout(tryInitialize, retryDelay);
                } else {
                    console.error("Failed to initialize HanziWriter after maximum attempts");
                }
            }

            // Reset writer before attempting initialization
            resetWriter();
            tryInitialize();
        }

        // Wait for DOM and resources to be fully loaded
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            waitForResourcesAndInitialize();
        } else {
            document.addEventListener('DOMContentLoaded', waitForResourcesAndInitialize);
        }
    </script>
</body>
</html>
