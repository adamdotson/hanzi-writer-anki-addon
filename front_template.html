<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0 auto;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100%;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        .pinyin-wrapper {
            width: 300px;
            text-align: center;
        }
        .pinyin {
            font-size: 32px;
            padding: 10px 0;
            font-family: sans-serif;
        }
        .hanzi-container {
            width: 300px;
            height: 300px;
            background-color: #FFFFFF;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .nightMode .hanzi-container {
            background-color: #BBB; /* Darker container */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        .button-wrapper {
            display: flex;
            flex-direction: row;
            width: 300px;
            column-gap: 2px;
            justify-content: center;
        }
        .button-wrapper .preview-btn {
            width: 50%;
            margin: 0 auto;
            font-size: 16px;
            padding: 10px;
            border-radius: 4px;
        }
        .meaning {
            font-size: 24px;
            text-align: center;
            padding: 10px 0;
            border-radius: 4px;
            width: 300px;
        }
    </style>
</head>
<body>
    <audio id="myAudio">
        <source src="{{Audio}}" type="audio/mp3">
    </audio>
    <script>
        window.addEventListener('load', function() {
            var audio = document.getElementById('myAudio');
            audio.play().catch(function(error) {
                console.log("Autoplay failed:", error);
            });
        });
    </script>
    <div class="pinyin-wrapper">
        <span class="pinyin">{{Pinyin}}</span>
    </div>
    <div id="hanzi-container" class="hanzi-container">
        <svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" id="grid-background-target">
            <line x1="5" y1="5" x2="295" y2="295" stroke="#DDD" />
            <line x1="295" y1="0" x2="0" y2="295" stroke="#DDD" />
            <line x1="150" y1="0" x2="150" y2="300" stroke="#DDD" />
            <line x1="0" y1="150" x2="300" y2="150" stroke="#DDD" />
        </svg>
    </div>
    <div class="meaning"><span>{{Meaning}}</span></div>
    <div class="button-wrapper">
        <button id="preview-btn" class="preview-btn" onclick="TriggerAnimation()">Show Preview</button>
        <button id="reset-btn" class="preview-btn" onclick="StartFromFirstChar()">Start Over</button>
    </div>
    <script src="hanzi-writer.min.js"></script>
    <script>
        // Global variables
        let writer = null; // Explicitly initialize to null
        const container = document.getElementById('hanzi-container');
        const proficiency = parseInt(`{{Proficiency}}` || 0);
        let currCharIndex = 0;
        const fullString = '{{Hanzi}}'.replace(/[^\u4E00-\u9FFF]/g, '') || '字';
        let currChar = fullString[currCharIndex];
        let isAnimating = false; // Track animation/quiz state

        // Reset writer for new card
        function resetWriter() {
            writer = null; // Clear previous writer instance
            console.log("Writer reset for new card");
        }

        function TriggerAnimation() {
            if (isAnimating) return;
            isAnimating = true;
            writer.animateCharacter().then(() => {
                isAnimating = false;
                TriggerQuiz();
            }).catch((error) => {
                console.error("Animation failed:", error);
                isAnimating = false;
            });
        }

        function TriggerQuiz() {
            if (isAnimating) return;
            isAnimating = true;
            writer.quiz({
                onComplete: function(summaryData) {
                    isAnimating = false;
                    ShowNextCharacter();
                }
            });
        }

        function ShowNextCharacter() {
            if (currCharIndex < fullString.length - 1) {
                currCharIndex += 1;
                currChar = fullString[currCharIndex];
                writer.setCharacter(currChar).then(() => {
                    if (proficiency < 5) {
                        TriggerAnimation();
                    } else {
                        TriggerQuiz();
                    }
                }).catch((error) => {
                    console.error("Set character failed:", error);
                    isAnimating = false;
                });
            }
        }

        function StartFromFirstChar() {
            if (isAnimating) return;
            currCharIndex = 0;
            currChar = fullString[currCharIndex];
            writer.setCharacter(currChar).then(() => {
                if (proficiency < 5) {
                    TriggerAnimation();
                } else {
                    TriggerQuiz();
                }
            }).catch((error) => {
                console.error("Reset failed:", error);
            });
        }

        function initializeHanziWriter() {
            if (writer) {
                console.log("Writer already initialized for this card");
                return true; // Skip if already initialized for this card
            }
            if (!container || !window.HanziWriter) {
                console.warn("Container or HanziWriter not ready");
                return false;
            }

            const hanziDiv = document.getElementById('hanzi-container');
            ['touchstart'].forEach(function(eventName) {
                hanziDiv.addEventListener(eventName, function(e) {
                    e.stopPropagation();
                }, false);
            });

            // Set playback speed based on proficiency
            const strokeSpeed = proficiency >= 3 ? 1.5 : 1;
            const strokeDelay = proficiency >= 3 ? 100 : 500;

            // Determine whether outline should be shown
            const shouldShowOutline = proficiency < 15;

            // Determine when to show next line hint
            const numMissesBeforeHint = proficiency < 5 ? 1 : 3;

            writer = HanziWriter.create('grid-background-target', currChar, {
                width: 300,
                height: 300,
                outlineColor: '#999',
                showOutline: shouldShowOutline,
                showCharacter: shouldShowOutline,
                showHintAfterMisses: numMissesBeforeHint,
                padding: 10,
                strokeAnimationSpeed: strokeSpeed,
                delayBetweenStrokes: strokeDelay,
                strokeColor: '#333',
            });

            // Hide preview button if proficiency >= 5
            if (proficiency >= 5) {
                const previewBtn = document.querySelector('#preview-btn');
                if (previewBtn) {
                    previewBtn.style.display = 'none';
                }
            }

            // Hide start over button if only 1 char
            if (fullString.length <= 1) {
                const startOverBtn = document.querySelector('#reset-btn');
                if (startOverBtn) {
                    startOverBtn.style.display = 'none';
                }
            }

            // Start the flow
            if (proficiency < 5) {
                TriggerAnimation();
            } else {
                TriggerQuiz();
            }
            console.log("HanziWriter initialized successfully");
            return true;
        }

        function waitForResourcesAndInitialize() {
            let attempts = 0;
            const maxAttempts = 10; // Limit retries
            const retryDelay = 100; // Delay between retries (ms)

            function tryInitialize() {
                if (initializeHanziWriter()) {
                    return;
                }
                if (attempts < maxAttempts) {
                    attempts++;
                    console.log(`Retrying initialization (attempt ${attempts}/${maxAttempts})...`);
                    setTimeout(tryInitialize, retryDelay);
                } else {
                    console.error("Failed to initialize HanziWriter after maximum attempts");
                }
            }

            // Reset writer before attempting initialization
            resetWriter();
            tryInitialize();
        }

        // Wait for DOM and resources to be fully loaded
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            waitForResourcesAndInitialize();
        } else {
            document.addEventListener('DOMContentLoaded', waitForResourcesAndInitialize);
        }
    </script>
</body>
</html>
